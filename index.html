
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github User Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <form id="github-user-test123" class="border p-4">
                    <div class="mb-3">
                        <label for="username" class="form-label">Enter GitHub Username</label>
                        <input type="text" id="username" name="username" class="form-control" placeholder="e.g. octocat">
                    </div>
                    <button type="submit" class="btn btn-primary">Fetch User Data</button>
                </form>
                <div id="user-data" class="mt-4">
                    <!-- User data will be displayed here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
